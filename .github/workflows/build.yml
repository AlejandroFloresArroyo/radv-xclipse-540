name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    # Arch Linux ARM, so glibc/libdrm match the proot the driver runs in.
    container: menci/archlinuxarm:base-devel
    env:
      FORK_REPO: yoro1836/radv-xclipse
      # JimVulkan/radv-xclipse 313870e + PR #6 (Xclipse 940 / MGFX2)
      FORK_SHA: d3f2c124c346a5e2aebfe19e8082412126db039e
      PREFIX: /opt/radv-xclipse-540
      # The fork ships a Mesa tree trimmed for Android (no src/loader, no vulkan_wayland.h, ...).
      # Files it deleted come back from upstream main on 2026-09-24, about where the fork
      # branched; files the fork changed are never overwritten.
      MESA_UPSTREAM_SHA: bbeb2dca9feed6ac88d71234a9dc5ae8aeed4275
    steps:
      - uses: actions/checkout@v5

      - name: Dependencies
        run: |
          pacman-key --init >/dev/null 2>&1 || true
          pacman-key --populate archlinuxarm >/dev/null 2>&1 || true
          # pacman's Landlock/alpm sandbox is not permitted inside the runner's Docker container.
          pacman -Syu --disable-sandbox --noconfirm --needed meson ninja python-mako python-yaml python-packaging \
            python-ply glslang libdrm wayland wayland-protocols zstd libelf expat zlib bison flex git \
            libx11 libxcb libxext libxfixes libxrandr libxshmfence libxxf86vm xorgproto
          ldd --version | head -1
          pacman -Q glibc libdrm meson gcc glslang

      - name: Source
        run: |
          curl -fsSL -o src.tar.gz "https://codeload.github.com/$FORK_REPO/tar.gz/$FORK_SHA"
          mkdir mesa
          tar xzf src.tar.gz -C mesa --strip-components=1
          curl -fsSL -o upstream.tar.gz \
            "https://gitlab.freedesktop.org/mesa/mesa/-/archive/$MESA_UPSTREAM_SHA/mesa-$MESA_UPSTREAM_SHA.tar.gz"
          mkdir upstream
          tar xzf upstream.tar.gz -C upstream --strip-components=1
          before=$(find mesa -type f | wc -l)
          cp -r --update=none upstream/include/. mesa/include/
          cp -r --update=none upstream/src/. mesa/src/
          echo "restored $(( $(find mesa -type f | wc -l) - before )) files deleted by the fork"
          cd mesa
          for p in ../patches/*.diff; do echo "== $p"; git apply -v "$p"; done

      - name: Configure
        run: |
          cd mesa
          meson setup build --prefix="$PREFIX" --libdir=lib \
            -Dbuildtype=release -Db_ndebug=true \
            -Dplatforms=x11,wayland -Dandroid-stub=false \
            -Dvulkan-drivers=amd -Dgallium-drivers= -Dvulkan-layers= -Dtools= \
            -Dllvm=disabled -Dzstd=enabled -Dlmsensors=disabled -Dperfetto=false \
            -Dglx=disabled -Dgbm=disabled -Degl=disabled -Dgles1=disabled -Dgles2=disabled \
            -Dvideo-codecs= \
            -Dc_args="-I$GITHUB_WORKSPACE/compat" -Dcpp_args="-I$GITHUB_WORKSPACE/compat"

      - name: Build
        # -k 0: keep going so one run reports every file that fails on glibc.
        run: ninja -C mesa/build -k 0

      - name: Install and check
        run: |
          DESTDIR="$PWD/stage" meson install -C mesa/build --no-rebuild
          find stage -type f | sort
          so=$(find stage -name libvulkan_radeon.so | head -1)
          echo "newest glibc symbol needed:"
          objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          grep -c XCLIPSE "$so" || true
          tar -C stage -czf radv-xclipse-540-aarch64.tar.gz opt

      - uses: actions/upload-artifact@v4
        with:
          name: radv-xclipse-540-aarch64
          path: radv-xclipse-540-aarch64.tar.gz
